<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#173d2f" />
<title>BlitzWord</title>
<link rel="stylesheet" href="styles.css?v=forest-20260921-r4" />
</head>
<body><main class="app" id="app">
<button id="resetBtn" class="smallReset" title="Reset" aria-label="Reset">↺</button>
<button id="pauseBtn" class="pauseButton" aria-label="Pause" hidden>Ⅱ</button>
<button id="wordReady" class="roundButton wordReady" aria-label="Ready to choose" hidden>→</button>

<section id="setup" class="screen active forest">
  <div class="setupBrand"><div class="logo">BlitzWord<span class="leaf">◆</span></div><div class="tag">Win the reading battle</div></div>
  <span class="sceneSprite setupPip" data-sprite="6" role="img" aria-label="Pip, your dragon companion"></span>
  <div class="setupCard parchment">
    
    <label class="fieldLabel" for="nameInput">Your name</label>
    <input id="nameInput" class="nameInput" maxlength="18" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="next" placeholder="Name" />
    <div class="fieldLabel">How old are you?</div><div class="choiceRow" id="ageChoices"></div>
    <div class="fieldLabel">Pick your hero look</div>
    <div class="choiceRow">
      <button class="genderCard" data-gender="boy"><span class="heroPortrait" data-hero-index="0" role="img" aria-label="Boy hero"></span><span>Boy</span></button>
      <button class="genderCard" data-gender="girl"><span class="heroPortrait" data-hero-index="3" role="img" aria-label="Girl hero"></span><span>Girl</span></button>
    </div>
    <button id="setupNext" class="greenButton setupGo" aria-label="Continue">→</button>
  </div>
</section>

<section id="hero" class="screen forest">
  <div class="heroTitle">Pick your hero</div><div id="heroGrid" class="heroGrid"></div>
  <button id="heroNext" class="greenButton heroGo" aria-label="Continue">→</button>
</section>

<section id="route" class="screen forest">
  <div class="routePanel parchment">
    <div class="routeHero"><span id="routeHeroImg" class="heroPortrait" role="img" aria-label="Selected hero"></span><img class="routePip" src="assets/pip.webp" alt="Pip"/></div>
    <div class="routeTitle">Ready?</div>
    <p class="routeSub" id="routeName"></p>
    <div class="routeButtons"><button id="continueAdventure" class="greenButton" hidden>Continue adventure</button><button id="tryBattle" class="greenButton">Try a battle</button><button id="checkFirst" class="secondaryButton">Reading check first</button></div>
    <p id="sessionNote" class="sessionNote"></p>
  </div>
</section>

<section id="teaching" class="screen">
  <div class="teachCard parchment"><div id="teachSentence" class="teachSentence"></div><img id="teachIllustration" class="teachIllustration" alt=""/><p id="lessonStatus" class="lessonStatus" aria-live="polite"></p><div class="teachControls"><button id="teachReplay" class="replay" aria-label="Replay">🔊</button><button id="teachContinue" class="roundButton" aria-label="Continue">→</button></div></div>
</section>

<section id="assessment" class="screen playfield">
  <div class="battleShell"><div class="topHud"><div class="modeLabel">Reading check</div><div id="assessmentProgress" class="assessmentProgress"></div></div><div class="battleCenter"><div id="assessmentScroll" class="scroll parchment"></div></div><div class="answerDock"><div id="assessmentAnswers" class="answers"></div><button id="assessmentUnsure" class="unsure" aria-label="I'm not sure" hidden>?</button></div></div>
</section>

<section id="battle" class="screen playfield">
  <div class="battleShell">
    <div class="topHud"><div id="heroHearts" class="hearts" role="img"></div><div id="battleMode" class="modeLabel">Adventure</div><div class="enemyHud"><div id="enemyHealth" class="enemyBar" role="img"><div id="enemyFill" class="enemyFill"></div></div></div></div>
    <div class="battleCenter"><div id="battleScroll" class="scroll parchment"></div></div><div class="answerDock"><div id="battleAnswers" class="answers"></div><button id="battleUnsure" class="unsure" aria-label="I'm not sure" hidden>?</button></div>
  </div>
  <span id="battleHeroImg" class="sceneSprite battleHero" role="img" aria-label="Hero"></span><span class="sceneSprite battlePip" data-sprite="6" role="img" aria-label="Pip"></span><span id="enemyFace" class="sceneSprite battleEnemy" data-sprite="7" role="img" aria-label="Thornling"></span>
  <div id="feedback" class="feedback">✓</div>

</section>

<section id="handoff" class="screen forest">
  <div class="handoffCard parchment"><span class="sceneSprite handoffPip" data-sprite="6" role="img" aria-label="Pip"></span><h1 id="handoffTitle">The path is clear!</h1><p>A quiet moment to find your starting point.</p><button id="handoffNext" class="greenButton">Reading check →</button></div>
</section>
<section id="result" class="screen">
  <div class="resultCard parchment"><div id="resultIcon" class="resultIcon"></div><div id="resultTitle" class="resultTitle"></div><div id="checkpoint" class="checkpoint"></div><div id="opponents" class="opponents"></div><button id="resultNext" class="greenButton resultNext">→</button></div>
</section>
<section id="summary" class="screen forest">
  <div class="summaryCard parchment">
    <img src="assets/pip.webp" alt="Pip" class="summaryPip"/>
    <h2 id="summaryTitle">Challenge complete</h2>
    <p id="summaryDetail"></p><p id="summaryWords"></p>
    <p class="sessionNote">Your progress is saved.</p>
    <div class="routeButtons"><button id="anotherChallenge" class="greenButton">Another challenge</button><button id="doneToday" class="secondaryButton">Done for today</button></div>
  </div>
</section>
<div id="pausePanel" class="modalLayer" role="dialog" aria-modal="true" aria-labelledby="pauseTitle" hidden>
  <div class="pauseCard parchment"><h2 id="pauseTitle">Paused</h2><p id="pauseTime"></p>
    <label class="voiceSetting" for="voiceChoice">Narrator</label><select id="voiceChoice" aria-label="Narrator"></select><button id="previewVoice" class="voicePreview">Listen</button>
    <label id="paceSetting" class="paceSetting"><input id="selfPacedSetting" type="checkbox"/> Take my time with each word</label>
    <div class="routeButtons"><button id="pauseResume" class="greenButton">Continue</button><button id="pauseFinish" class="secondaryButton">Finish for now</button></div>
  </div>
</div>
<div id="saveNotice" class="modalLayer saveNotice" role="alertdialog" aria-modal="true" aria-labelledby="saveTitle" hidden>
  <div class="pauseCard parchment"><h2 id="saveTitle">Saving paused</h2><p id="saveMessage"></p>
    <div class="routeButtons"><button id="retrySave" class="greenButton">Try saving again</button><button id="reloadSaved" class="secondaryButton">Reload saved progress</button></div>
  </div>
</div>
</main>
<script src="content.js?v=forest-20260921-r4"></script>
<script src="game-core.js?v=forest-20260921-r4"></script>
<script src="storage.js?v=forest-20260921-r4"></script>
<script src="audio.js?v=forest-20260921-r4"></script>
<script src="app.js?v=forest-20260921-r4"></script></body></html>
