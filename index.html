<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#173d2f" />
<title>BlitzWord</title>
<link rel="stylesheet" href="styles.css?v=heroes-20260921" />
</head>
<body><main class="app" id="app">
<button id="resetBtn" class="smallReset" title="Reset" aria-label="Reset">↺</button>

<section id="setup" class="screen active forest">
  <div class="setupBrand"><div class="logo">BlitzWord<span class="leaf">◆</span></div><div class="tag">Win the reading battle</div></div>
  <div class="setupCard parchment">
    <h2>Set up</h2>
    <div class="fieldLabel">Your name</div>
    <input id="nameInput" class="nameInput" maxlength="18" autocomplete="off" placeholder="Name" />
    <div class="fieldLabel">How old are you?</div><div class="choiceRow" id="ageChoices"></div>
    <div class="fieldLabel">Pick your hero look</div>
    <div class="choiceRow">
      <button class="genderCard" data-gender="boy"><span class="heroPortrait" data-hero-index="0" role="img" aria-label="Boy hero"></span><span>Boy</span></button>
      <button class="genderCard" data-gender="girl"><span class="heroPortrait" data-hero-index="3" role="img" aria-label="Girl hero"></span><span>Girl</span></button>
    </div>
    <button id="setupNext" class="greenButton setupGo" aria-label="Continue">→</button>
  </div>
</section>

<section id="hero" class="screen forest">
  <div class="heroTitle">Pick your hero</div><div id="heroGrid" class="heroGrid"></div>
  <button id="heroNext" class="greenButton heroGo" aria-label="Continue">→</button>
</section>

<section id="route" class="screen forest">
  <div class="routePanel parchment">
    <div class="routeHero"><span id="routeHeroImg" class="heroPortrait" role="img" aria-label="Selected hero"></span><img class="routePip" src="assets/pip.webp" alt="Pip"/></div>
    <div class="routeTitle">Ready?</div>
    <p class="routeSub" id="routeName"></p>
    <div class="routeButtons"><button id="tryBattle" class="greenButton">Try a battle</button><button id="checkFirst" class="secondaryButton">Reading check first</button></div>
  </div>
</section>

<section id="teaching" class="screen">
  <div class="teachCard parchment"><div class="teachSentence">The hero <span class="targetWord">sat</span> on the rock.</div><div class="teachScene" aria-label="The hero sitting on a rock with Pip"><div class="teachRock"></div><span id="teachHeroImg" class="teachHero heroPortrait" role="img" aria-label="Selected hero"></span><img class="teachPip" src="assets/pip.webp" alt="Pip"/></div><div class="teachControls"><button id="teachReplay" class="replay" aria-label="Replay">🔊</button><button id="teachContinue" class="roundButton" aria-label="Continue">→</button></div></div>
</section>

<section id="assessment" class="screen playfield">
  <div class="battleShell"><div class="topHud"><div class="assessmentMark">✦</div></div><div class="battleCenter"><div id="assessmentScroll" class="scroll parchment"></div></div><div id="assessmentAnswers" class="answers"></div><button id="assessmentUnsure" class="unsure" aria-label="I'm not sure">?</button></div>
</section>

<section id="battle" class="screen playfield">
  <div class="battleShell">
    <div class="topHud"><div id="heroHearts" class="hearts"></div><div class="enemyHud"><div class="enemyBar"><div id="enemyFill" class="enemyFill"></div></div><div id="enemyFace" class="enemyFace">🪨</div></div></div>
    <div class="battleCenter"><div id="battleScroll" class="scroll parchment"></div></div><div id="battleAnswers" class="answers"></div>
  </div>
  <span id="battleHeroImg" class="heroBadge heroPortrait" role="img" aria-label="Hero"></span><img class="pipBadge" src="assets/pip.webp" alt="Pip"/>
  <div id="feedback" class="feedback">✓</div>
  <div id="correction" class="correction"><div class="correctionCard parchment"><div class="fieldLabel">The word was</div><div id="correctWord" class="correctWord"></div><div class="correctionControls"><button id="correctReplay" class="replay" aria-label="Replay">🔊</button><button id="correctContinue" class="roundButton" aria-label="Continue">→</button></div></div></div>
</section>

<section id="result" class="screen">
  <div class="resultCard parchment"><div id="resultIcon" class="resultIcon"></div><div id="resultTitle" class="resultTitle"></div><div id="checkpoint" class="checkpoint"></div><div id="opponents" class="opponents"></div><button id="resultNext" class="greenButton resultNext">→</button></div>
</section>
</main>
<script src="app.js?v=heroes-20260921"></script></body></html>
