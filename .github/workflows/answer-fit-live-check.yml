name: Verify live answer fit
on:
  push:
    branches: [claude/answer-fit-live-check]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: da36256c2d7035c8a49554464430a1c3b9933b1d
      - name: Compare live game files with da36256
        run: |
          B=https://ikarus-eth.github.io/Blitzword_app
          for attempt in $(seq 1 30); do
            curl -s -o probe.html "$B/index.html?cb=$GITHUB_RUN_ID-$attempt"
            if cmp -s probe.html index.html; then echo "live after attempt $attempt"; break; fi
            sleep 30
          done
          bad=0; n=0
          for f in index.html app.js adventures.css styles.css game-core.js adventure-ui.js; do
            n=$((n+1)); code=$(curl -s -o live.bin -w '%{http_code}' "$B/$f?cb=$GITHUB_RUN_ID")
            if [ "$code" = 200 ] && cmp -s live.bin "$f"; then echo "OK $f"; else echo "MISMATCH $f ($code)"; bad=$((bad+1)); fi
          done
          echo "checked=$n mismatched=$bad"; test $bad -eq 0
