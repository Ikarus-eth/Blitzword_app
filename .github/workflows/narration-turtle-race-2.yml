name: Generate turtle race opponent narration
on:
  push:
    branches: [claude/turtle-race-narration-20261024]
    paths: [docs/turtle-race/NARRATION_REQUEST_2.json, .github/workflows/narration-turtle-race-2.yml]
permissions:
  contents: write
concurrency:
  group: turtle-race-narration-2
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'Ikarus-eth/Blitzword_app'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install audio validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Generate opponent lines (bounded, no retries)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/generate-budget-narration.py turtle-race-2
      - name: Commit paid output to this generation-only branch, even on failure
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898275+github-actions[bot]@users.noreply.github.com"
          git add narration-turtle-race-2-output || exit 0
          git commit -m "Deliver paid turtle race opponent narration output" || exit 0
          git push origin HEAD:claude/turtle-race-narration-20261024
