name: Generate mission illustrations with fal.ai

on:
  push:
    branches: [codex/creature-campaigns-20261003]
    paths: [.github/workflows/mission-art.yml, docs/adventures/art-prompts.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission-art
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Generate the fixed 12-image batch
        env:
          FAL_KEY: ${{ secrets.AL_AI_API }}
        run: python3 scripts/generate-mission-art.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-illustrations
          path: generated-mission-art/
          retention-days: 30
