name: Generate mission illustrations with fal.ai

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Optional reviewed story batch under docs/adventures/ (it states its exact image count). Empty runs the fixed 12-image mission batch.
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: mission-art
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Generate the fixed 12-image batch
        if: ${{ inputs.batch == '' }}
        env:
          FAL_KEY: ${{ secrets.AL_AI_API }}
        run: python3 scripts/generate-mission-art.py
      - name: Generate one reviewed story batch
        if: ${{ inputs.batch != '' }}
        env:
          FAL_KEY: ${{ secrets.AL_AI_API }}
          BATCH: ${{ inputs.batch }}
        run: python3 scripts/generate-story-art.py "$BATCH"
      # Story batches are also committed to their own branch for review, never to main.
      - name: Commit the story batch for review on this branch
        if: ${{ always() && inputs.batch != '' && github.ref_name != 'main' }}
        env:
          BATCH: ${{ inputs.batch }}
        run: |
          name=$(basename "$BATCH" .json)
          dest="$(dirname "$BATCH")/generated/$name"
          mkdir -p "$dest" && cp generated-story-art/* "$dest"/
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest" && git commit -m "Story art for review: $name [skip ci]" && git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-illustrations
          path: |
            generated-mission-art/
            generated-story-art/
          retention-days: 30
