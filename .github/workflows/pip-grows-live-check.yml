name: Verify live creature vote page
on:
  push:
    branches: [claude/pip-grows-live-check]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b5e24fce3b5aa4fd6bdad548b01ac47de08b833c
      - name: Compare live vote page with merge b5e24fc
        run: |
          B=https://ikarus-eth.github.io/Blitzword_app
          for attempt in $(seq 1 30); do
            curl -s -o probe "$B/assets/new-creatures-vote/catalog.json?cb=$GITHUB_RUN_ID-$attempt"
            if cmp -s probe assets/new-creatures-vote/catalog.json; then echo "live after attempt $attempt"; break; fi
            sleep 30
          done
          bad=0; n=0
          for f in $(git ls-files assets/new-creatures-vote); do
            n=$((n+1)); code=$(curl -s -o live.bin -w '%{http_code}' "$B/$f?cb=$GITHUB_RUN_ID")
            if [ "$code" = 200 ] && cmp -s live.bin "$f"; then :; else echo "MISMATCH $f ($code)"; bad=$((bad+1)); fi
          done
          echo "checked=$n mismatched=$bad"; test $bad -eq 0
