name: Verify live new creatures vote
on:
  push:
    branches: [claude/pip-grows-live-check]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 00a1e30454917940fd5f153c87e6d2a1536a258d
      - name: Compare live files with merge 00a1e30
        run: |
          B=https://ikarus-eth.github.io/Blitzword_app
          P=assets/new-creatures-vote
          for attempt in $(seq 1 30); do
            curl -s -o probe.json "$B/$P/catalog.json?cb=$GITHUB_RUN_ID-$attempt"
            if cmp -s probe.json $P/catalog.json; then echo "live after attempt $attempt"; break; fi
            sleep 30
          done
          bad=0; n=0
          for f in index.html $P/index.html $P/review.js $P/selection.js $P/review.css $P/catalog.json $P/artwork-manifest.json $P/pictures/*.webp; do
            n=$((n+1)); code=$(curl -s -o live.bin -w '%{http_code}' "$B/$f?cb=$GITHUB_RUN_ID")
            if [ "$code" = 200 ] && cmp -s live.bin "$f"; then echo "OK $f"; else echo "MISMATCH $f ($code)"; bad=$((bad+1)); fi
          done
          echo "checked=$n mismatched=$bad"; test $bad -eq 0
