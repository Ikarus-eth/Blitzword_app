name: Deliver turtle race narration
on:
  push:
    branches: [claude/turtle-race-narration-20261024]
    paths: [.github/workflows/narration-turtle-race-deliver.yml]
permissions:
  contents: write
  actions: read
jobs:
  deliver:
    if: github.repository == 'Ikarus-eth/Blitzword_app'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Retrieve paid output from run 40079494410 (no provider calls)
        uses: actions/download-artifact@v4
        with:
          name: narration-turtle-race
          run-id: 40079494410
          github-token: ${{ github.token }}
          path: narration-turtle-race-output
      - name: Commit output to the generation-only branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898275+github-actions[bot]@users.noreply.github.com"
          git add narration-turtle-race-output
          git commit -m "Deliver paid turtle race narration output from run 40079494410"
          git push origin HEAD:claude/turtle-race-narration-20261024
