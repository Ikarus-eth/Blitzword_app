name: Deploy BlitzWord to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Check scripts and practice regressions
        run: |
          node --check app.js
          node --check game-core.js
          node --check storage.js
          node --check engagement.js
          npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/tests
          cp index.html styles.css app.js content.js game-core.js storage.js audio.js engagement.js _site/
          cp -R assets _site/assets
          cp tests/visual-review.html tests/review-app.html tests/review-scenarios.js _site/tests/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
