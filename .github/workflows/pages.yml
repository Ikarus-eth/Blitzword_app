name: Deploy BlitzWord to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Check scripts and practice regressions
        run: |
          node --check app.js
          node --check game-core.js
          node --check storage.js
          node --check engagement.js
          node --check soundscape.js
          node --check audio.js
          node --check tests/narration-qa.js
          node --check enemy-art.js
          node --check enemy-art-data.js
          npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/tests
          cp index.html styles.css app.js content.js game-core.js storage.js audio.js narration.js soundscape.js engagement.js manifest.webmanifest enemy-art.js enemy-art-data.js enemy-art.css _site/
          cp -R assets _site/assets
          cp tests/visual-review.html tests/review-app.html tests/review-scenarios.js tests/scenery-review.html tests/narration-qa.html tests/narration-qa.js tests/enemy-review.html _site/tests/
      # Serialize releases and skip stale runs, including manual reruns of old commits.
      - name: Check that this release is still current main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; its workflow owns deployment."
          fi
      - name: Upload static site
        if: steps.current.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
