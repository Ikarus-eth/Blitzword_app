name: Deliver story art from an earlier run

# When a story-art run generated its pictures but could not push them, this copies its artifact to the branch.
on:
  push:
    branches-ignore: [main]
    paths: ['docs/adventures/*/art-deliver.json']

permissions:
  contents: write
  actions: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the delivery request
        run: |
          f=$(ls docs/adventures/*/art-deliver.json | head -1)
          echo "RUN_ID=$(jq -r .run "$f")" >> "$GITHUB_ENV"
          echo "DEST=$(dirname "$f")/generated/$(jq -r .batch "$f")" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: mission-illustrations
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: delivered
      - name: Commit the pictures to this branch
        run: |
          mkdir -p "$DEST" && cp delivered/generated-story-art/* "$DEST"/
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST" && git commit -m "Story art delivered from run $RUN_ID [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME"
