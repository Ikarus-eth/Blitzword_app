name: Test ElevenLabs secret

on:
  push:
    branches:
      - test/elevenlabs-secret-check-20260924

permissions:
  contents: read

jobs:
  elevenlabs:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret and authenticated user endpoint
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo "elevenlabs_secret_present=false"
            exit 1
          fi
          user_code="$(curl -sS -o /tmp/eleven-user.json -w '%{http_code}'             https://api.elevenlabs.io/v1/user             -H "xi-api-key: $ELEVENLABS_API_KEY")"
          echo "elevenlabs_user_http=$user_code"
          if [ "$user_code" != "200" ]; then
            exit 1
          fi
          echo "elevenlabs_secret_present=true"
          echo "elevenlabs_auth=true"

      - name: List available British male voices
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -euo pipefail
          curl -sS "https://api.elevenlabs.io/v2/voices?page_size=100"             -H "xi-api-key: $ELEVENLABS_API_KEY" > /tmp/voices.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/voices.json'))
          for v in d.get('voices',[]):
              labels=v.get('labels') or {}
              name=v.get('name','')
              gender=str(labels.get('gender','')).lower()
              accent=str(labels.get('accent','')).lower()
              use=str(labels.get('use_case','')).lower()
              if gender=='male' and ('brit' in accent or 'english' in accent or name.lower() in {'george','daniel','tom'}):
                  print("candidate_voice="+json.dumps({"name":name,"voice_id":v.get("voice_id"),"labels":labels},sort_keys=True))
          PY

      - name: Check text-to-speech permission with tiny generation
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -euo pipefail
          tts_code="$(curl -sS -o /tmp/eleven-test.mp3 -w '%{http_code}'             -X POST "https://api.elevenlabs.io/v1/text-to-speech/JBFqnCBsd6RMkjVDRZzb?output_format=mp3_44100_128"             -H "xi-api-key: $ELEVENLABS_API_KEY"             -H "Content-Type: application/json"             -d '{"text":"Test.","model_id":"eleven_multilingual_v2"}')"
          echo "elevenlabs_tts_http=$tts_code"
          if [ "$tts_code" != "200" ]; then
            exit 1
          fi
          bytes="$(wc -c < /tmp/eleven-test.mp3 | tr -d ' ')"
          echo "elevenlabs_tts_bytes=$bytes"
          test "$bytes" -gt 1000
          echo "elevenlabs_tts=true"
