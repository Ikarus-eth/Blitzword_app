name: Generate story illustrations with fal.ai

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Reviewed batch file under docs/adventures/ (states its exact image count)
        required: true

permissions:
  contents: read

concurrency:
  group: story-art
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Generate one reviewed batch
        env:
          FAL_KEY: ${{ secrets.AL_AI_API }}
          BATCH: ${{ inputs.batch }}
        run: python3 scripts/generate-story-art.py "$BATCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-illustrations
          path: generated-story-art/
          retention-days: 30
