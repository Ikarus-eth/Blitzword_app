name: Verify live turtle race retention
on:
  push:
    branches: [claude/turtle-race-live-check]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: e39a9dcb811d9d8aeaa4507d95318641ddd5232a
      - name: Compare every live turtle race file with merge e39a9dc
        run: |
          B=https://ikarus-eth.github.io/Blitzword_app
          # Wait (up to 10 minutes) for Pages to publish the merge, then require every file to match.
          for attempt in $(seq 1 20); do
            curl -s -o probe.js "$B/assets/turtle-race/race-core.js?cb=$GITHUB_RUN_ID-$attempt"
            if cmp -s probe.js assets/turtle-race/race-core.js; then echo "live after attempt $attempt"; break; fi
            sleep 30
          done
          bad=0; n=0
          for f in index.html app.js game-core.js adventure-ui.js adventures.css $(git ls-tree -r --name-only HEAD assets/turtle-race assets/turtle-race-expert) assets/narration/turtle-race-001.mp3 assets/narration/turtle-race-002.mp3; do
            n=$((n+1)); code=$(curl -s -o live.bin -w '%{http_code}' "$B/$f?cb=$GITHUB_RUN_ID")
            if [ "$code" = 200 ] && cmp -s live.bin "$f"; then echo "OK $f"; else echo "MISMATCH $f ($code)"; bad=$((bad+1)); fi
          done
          echo "checked=$n mismatched=$bad"; test $bad -eq 0
      - name: All files match
        run: echo verified
