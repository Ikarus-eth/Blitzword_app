name: Verify live turtle race levels
on:
  push:
    branches: [claude/turtle-race-live-check]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 32e923175d969ac600424567276c4f592730052a
      - name: Compare every live turtle race file with merge 32e9231
        run: |
          B=https://ikarus-eth.github.io/Blitzword_app
          bad=0; n=0
          for f in index.html app.js adventure-ui.js adventures.css $(git ls-tree -r --name-only HEAD assets/turtle-race) assets/narration/turtle-race-001.mp3 assets/narration/turtle-race-002.mp3; do
            n=$((n+1)); code=$(curl -s -o live.bin -w '%{http_code}' "$B/$f?cb=$GITHUB_RUN_ID")
            if [ "$code" = 200 ] && cmp -s live.bin "$f"; then echo "OK $f"; else echo "MISMATCH $f ($code)"; bad=$((bad+1)); fi
          done
          echo "checked=$n mismatched=$bad"; test $bad -eq 0
      - name: All files match
        run: echo verified
