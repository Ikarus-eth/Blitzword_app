<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word listening check · BlitzWord</title>
<style>body{font:18px system-ui,sans-serif;background:#f4f1e8;color:#233c35;max-width:860px;margin:auto;padding:24px}h1{font-size:2rem;margin-bottom:8px}p{line-height:1.5}button,input,select{font:inherit;border:1px solid #9eaaa0;border-radius:8px;padding:10px;background:white;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #da8912;outline-offset:2px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}input{min-width:150px;flex:1}.row{display:flex;align-items:center;gap:10px;background:white;padding:12px;border-radius:10px;margin:8px 0}.word{flex:1;font-weight:650}.flag[aria-pressed=true]{background:#ffe3aa;border-color:#bc7700}.meta{font-size:14px;display:block;font-weight:400;color:#55665f}#status{min-height:1.5em}.listen{min-width:90px}a{color:#235c49}</style></head>
<body><h1>Word listening check</h1><p>Listen to a word, then flag it if the pronunciation sounds off. Your flags stay on this device. Download them when you’re ready to share.</p>
<div class="tools"><select id="scope" aria-label="Words to show"><option value="sample">50-word check</option><option value="new">All new word recordings</option><option value="all">All 1,000 words</option><option value="flagged">Flagged words</option></select><input id="search" type="search" placeholder="Find a word" aria-label="Find a word"><button id="download">Download flags</button></div>
<p id="count"></p><p id="status" role="status" aria-live="polite">Choose Listen to begin.</p><div id="list"></div>
<script src="../../content.js?v=target-words-fal-20261010-r1"></script><script src="../../narration.js?v=target-words-fal-20261010-r1"></script>
<script>
(()=>{'use strict';const words=BlitzContent.words,clips=BlitzNarration.clips,key='blitzword-word-audio-flags-v1';let flags={};try{flags=JSON.parse(localStorage.getItem(key)||'{}');if(!flags||Array.isArray(flags)||typeof flags!=='object')flags={};}catch{}let playing=null;const list=document.querySelector('#list'),status=document.querySelector('#status'),scope=document.querySelector('#scope'),search=document.querySelector('#search');const sample=new Set(['been','us','does','which','should','live','wind','present','close','reading','lead',"I'll"]);for(let i=0;i<words.length&&sample.size<50;i++)sample.add(words[(i*29)%words.length].w);const isNew=w=>clips[w.w]?.file.includes('word-fal-');
function stop(){if(playing){playing.pause();playing=null;}}
function listen(w){stop();const clip=clips[w.spoken||w.w];if(!clip){status.textContent='Recording unavailable for '+w.w;return;}const audio=new Audio('../../'+clip.file);playing=audio;status.textContent='Playing “'+w.w+'” · recording';audio.onended=()=>{if(playing===audio){status.textContent='Finished “'+w.w+'”.';playing=null;}};audio.onerror=()=>{if(playing===audio)status.textContent='Could not load “'+w.w+'”. Try again.';};audio.play().catch(()=>{if(playing===audio)status.textContent='Could not play “'+w.w+'”. Try again.';});}
function render(){list.replaceChildren();const q=search.value.trim().toLowerCase(),selected=words.filter(w=>(scope.value==='all'||scope.value==='new'&&isNew(w)||scope.value==='flagged'&&flags[w.w]||scope.value==='sample'&&sample.has(w.w))&&w.w.toLowerCase().includes(q));if(scope.value==='sample')selected.sort((a,b)=>[...sample].indexOf(a.w)-[...sample].indexOf(b.w));document.querySelector('#count').textContent=selected.length+(selected.length===1?' word · ':' words · ')+Object.keys(flags).length+' flagged';for(const w of selected){const row=document.createElement('div');row.className='row';const label=document.createElement('span');label.className='word';label.textContent=w.w;const meta=document.createElement('span');meta.className='meta';meta.textContent=w.spoken?w.spoken:(isNew(w)?'New recording':'Existing recording');label.append(meta);const play=document.createElement('button');play.className='listen';play.textContent='▶ Listen';play.setAttribute('aria-label','Listen to '+w.w);play.onclick=()=>listen(w);const flag=document.createElement('button');flag.className='flag';flag.textContent=flags[w.w]?'Flagged':'Flag';flag.setAttribute('aria-label','Flag '+w.w);flag.setAttribute('aria-pressed',String(!!flags[w.w]));flag.onclick=()=>{if(flags[w.w])delete flags[w.w];else flags[w.w]={word:w.w,file:clips[w.spoken||w.w]?.file,date:new Date().toISOString()};try{localStorage.setItem(key,JSON.stringify(flags));}catch{status.textContent='Flags could not be saved. Download them before leaving.';}render();};row.append(label,play,flag);list.append(row);}}
scope.onchange=render;search.oninput=render;document.querySelector('#download').onclick=()=>{const blob=new Blob([JSON.stringify({version:BlitzNarration.version,flags:Object.values(flags)},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='blitzword-pronunciation-flags.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});render();})();
</script></body></html>
