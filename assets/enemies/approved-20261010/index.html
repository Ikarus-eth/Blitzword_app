<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlitzWord · Approved creatures</title>
<style>body{margin:0;background:#f6efde;color:#173d30;font:16px system-ui}header,main{max-width:1400px;margin:auto;padding:22px}h1{font:36px Georgia}button,select,a{font:inherit}button,select{min-height:44px;border:1px solid #b0b9a4;background:#fffdf6;border-radius:9px;padding:9px;color:inherit;cursor:pointer}header nav{display:flex;gap:12px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}article{background:#fffdf7;border:1px solid #d7d4c3;border-radius:15px;overflow:hidden}h2,article p,article nav{margin:14px}h2{font:23px Georgia}.art{height:260px;background:#284a3e}.art.light{background:#fffdf7}.art.check{background:repeating-conic-gradient(#ccc 0% 25%,#fff 0% 50%) 0/20px 20px}.art>svg{display:block;width:100%;height:100%}article nav{display:flex;flex-wrap:wrap;gap:8px}iframe{width:100%;height:min(800px,calc(90vh - 100px));min-height:320px;border:0}dialog{width:min(1200px,94vw);max-height:94vh;padding:12px;border:1px solid #acb6a6;border-radius:12px;background:#f6efde}dialog::backdrop{background:#001c20aa}dialog header{padding:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#status{min-height:24px}a{color:inherit}@media(max-width:500px){header,main{padding:14px}h1{font-size:29px}.art{height:310px}}</style></head><body>
<header><a href="../../../">← BlitzWord</a><h1>Artus’s 45 new creatures</h1><p>Approved looks, ready for future chapters. Ore Ant was excluded. Try a voice or a battle movement below. This preview never changes your adventure.</p><nav><label>Group <select id="group"></select></label><button id="background">Change background</button></nav><p id="status" role="status"></p></header><main class="cards" id="cards"></main>
<dialog id="battle"><header><strong id="battleName"></strong><select id="action" aria-label="Battle action"><option value="cast">Magic hit</option><option value="counter">Creature attack</option><option value="assist">Pip helps</option><option value="defeat">Creature retreats</option><option value="enemyvictory">Creature celebrates</option></select><button id="play">Play again</button><button id="close">Close</button></header><iframe id="game" title="Isolated battle preview"></iframe></dialog>
<script src="roster.js"></script><script src="../../../assets/battle-motion/manifest.js"></script><script src="../../../assets/battle-motion/runtime.js"></script><script src="../../../narration.js"></script><script src="../../../audio.js"></script><script>
const $=id=>document.getElementById(id),entries=BlitzApprovedEnemies.entries,voice=BlitzAudio.narrator({synth:window.speechSynthesis,Utterance:window.SpeechSynthesisUtterance,AudioContext:window.AudioContext||window.webkitAudioContext,fetchAudio:url=>fetch('../../../'+url),clips:BlitzNarration.clips});
let selected=null,background=0;for(let i=0;i<9;i++){const o=document.createElement('option');o.value=i;o.textContent=(i*5+1)+'–'+Math.min(45,i*5+5);$('group').append(o);}
function speak(text){voice.unlock();voice.speak(text,{onEnd:()=>{$('status').textContent='';}});$('status').textContent='Listening…';}
function render(){voice.cancel();$('status').textContent='';$('cards').replaceChildren();for(const e of entries.slice(Number($('group').value)*5,Number($('group').value)*5+5)){const card=document.createElement('article');const a=e.art;card.innerHTML='<div class="art '+['','light','check'][background]+'"><svg viewBox="'+a.view.join(' ')+'" preserveAspectRatio="xMidYMid meet" aria-label="'+e.name+'"><svg x="'+a.view[0]+'" y="'+a.view[1]+'" width="'+a.view[2]+'" height="'+a.view[3]+'" viewBox="'+a.view.join(' ')+'" overflow="hidden"><image href="../../../'+a.source+'" width="'+a.width+'" height="'+a.height+'"/></svg></svg></div><h2>'+e.name+'</h2><p>'+e.title+' · Artus '+e.score+'/5</p><p>'+e.lore[1]+'</p><nav></nav>';for(const [label,fn] of [['Hear name',()=>speak(e.name)],['Hear secret',()=>speak(e.lore[1])],['Battle preview',()=>{voice.cancel();selected=e;$('battleName').textContent=e.name;$('battle').showModal();play();}]]){const b=document.createElement('button');b.textContent=label;b.onclick=fn;card.querySelector('nav').append(b);}$('cards').append(card);}}
function play(){$('game').src='../../../tests/review-app.html?scene='+encodeURIComponent('motion-all:'+selected.id+':'+$('action').value)+'&motion=play';}
$('group').onchange=render;$('background').onclick=()=>{background=(background+1)%3;render();};$('play').onclick=play;$('action').onchange=play;$('close').onclick=()=>$('battle').close();$('battle').addEventListener('close',()=>{$('game').src='about:blank';});document.addEventListener('visibilitychange',()=>{if(document.hidden)voice.cancel();});window.addEventListener('pagehide',()=>voice.cancel());render();
</script></body></html>
