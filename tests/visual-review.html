<!doctype html><html lang="en"><meta charset="utf-8"><title>BlitzWord layout review</title><style>body{margin:0;background:#10241c;color:#fff;font:16px system-ui}nav{padding:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{padding:8px 14px;font:inherit}#frameWrap{transform-origin:top left;margin:0 auto}iframe{display:block;border:0}</style><nav>Isolated layout review <button data-size="1024,768">iPad landscape</button><button data-size="768,1024">iPad portrait</button><button data-size="390,844">Phone</button><button data-size="844,390">Phone landscape</button><label>Screen <select id="scenario"><option value="setup">Start</option><option value="heroes">Female heroes</option><option value="route">Camp</option><option value="map">Campaign map</option><option value="map-chapter-2">Map · River Path</option><option value="lesson-unicorn">Teaching · unicorn</option><option value="map-near-growth">Map · 1 XP to grow</option><option value="map-young">Map · Big Pip</option><option value="parents">Parent dashboard gate</option><option value="lesson-water">Teaching · water</option><option value="lesson-small">Teaching · small</option><option value="lesson-night">Teaching · night</option><option value="lesson-magic">Teaching · magic</option><option value="teaching">Teaching</option><option value="math-intro">Multiplication · revival</option><option value="math-play">Multiplication · challenge</option><option value="math-loss">Multiplication · retry</option><option value="lesson-gate">Teaching · gate</option><option value="math-result">Multiplication · PR</option><option value="battle">Battle</option><option value="attack-mage">Mage cast</option><option value="attack-mage-female">Mage cast · female</option><option value="attack-mage-final">Mage + Pip · final blow</option><option value="attack-knight">Knight attack</option><option value="attack-archer">Archer attack</option><option value="assessment">Reading check</option><option value="handoff">Handoff
