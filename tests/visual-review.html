<!doctype html><html lang="en"><meta charset="utf-8"><title>BlitzWord layout review</title><style>body{margin:0;background:#10241c;color:#fff;font:16px system-ui}nav{padding:10px;display:flex;gap:10px;align-items:center}button{padding:8px 14px;font:inherit}#frameWrap{transform-origin:top left;margin:0 auto}iframe{display:block;border:0}</style><nav>Isolated layout review <button data-size="1024,768">iPad landscape</button><button data-size="768,1024">iPad portrait</button><button data-size="390,844">Phone</button><button data-size="844,390">Phone landscape</button></nav><div id="frameWrap"><iframe id="review" title="Isolated BlitzWord preview" src="review-app.html" width="1024" height="768"></iframe></div><script>let w=1024,h=768;function size(){const scale=Math.min(1,(innerWidth-24)/w,(innerHeight-65)/h),wrap=document.getElementById('frameWrap');wrap.style.width=w+'px';wrap.style.height=h+'px';wrap.style.transform=`scale(${scale})`;document.getElementById('review').width=w;document.getElementById('review').height=h;}document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{[w,h]=b.dataset.size.split(',').map(Number);size()});addEventListener('resize',size);size();</script></html>
