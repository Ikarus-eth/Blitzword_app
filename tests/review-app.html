<!doctype html><html lang="en"><meta charset="utf-8"><title>Isolated BlitzWord review</title><script>
// This separate test entry uses only memory. It never reads or writes learner saves.
fetch('../index.html?review='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(html=>{
 const override=`<script>window.BlitzStorage={...BlitzStorage,KEY:'blitzword_visual_review',AdventureStore:class extends BlitzStorage.AdventureStore{constructor(){const data=new Map();super({getItem:k=>data.get(k)??null,setItem:(k,v)=>data.set(k,v),removeItem:k=>data.delete(k)});}}};<\/script>`;
 html=html.replace('<head>','<head><base href="../">').replace('<script src="app.js',override+'<script src="app.js');
 document.open();document.write(html);document.close();
});</script></html>
