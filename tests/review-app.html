<!doctype html><html lang="en"><meta charset="utf-8"><title>Isolated BlitzWord review</title><script>
// This separate test entry uses only memory. It never reads or writes learner saves.
const params=new URLSearchParams(location.search),scene=params.get('scene')||'setup',holdImpact=scene.startsWith('attack-')&&params.get('motion')!=='play',holdEscape=scene==='retry-escape'&&params.get('motion')!=='play';
fetch('../index.html?review='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(html=>{
 const safeScene=JSON.stringify(scene).replace(/</g,'\\u003c');
 const override=`<script src="tests/review-scenarios.js?v=chapter-stories-r2"><\/script><script>
 window.reviewScene=${safeScene};
 if(${holdImpact}||${holdEscape}){
   // Test-only held pose. Normal play and the Play animation button keep real timing.
   const nativeTimeout=window.setTimeout.bind(window);
   window.setTimeout=(fn,ms,...args)=>((${holdImpact}&&ms===1300)||(${holdEscape}&&ms===2200))?0:nativeTimeout(fn,ms,...args);
   const style=document.createElement('style');style.textContent=${holdEscape}?'.escaping #defeatEnemy,.escaping .enemyChuckle,.escaping .escapeCaption{animation-play-state:paused!important;animation-delay:-.35s!important}':'.staffArm,.castBeam,.combatEffects *,.battleHero,.battleEnemy,.battlePip{animation-play-state:paused!important;animation-delay:-.66s!important}';document.head.append(style);
 }
 const learnerStorageKey=BlitzStorage.KEY;window.BlitzStorage={...BlitzStorage,KEY:'blitzword_visual_review',AdventureStore:class extends BlitzStorage.AdventureStore{constructor(){const data=new Map([[learnerStorageKey,window.reviewScene==='error'?'broken save':JSON.stringify(makeReviewSave(window.reviewScene))]]);super({getItem:k=>data.get(k)??null,setItem:(k,v)=>data.set(k,v),removeItem:k=>data.delete(k)});}}};<\/script>`;
 const activate=`<script>if(window.reviewScene==='parents'){document.getElementById('mapParents').click();}else if(!['setup','heroes','route','error','name-dragon'].includes(window.reviewScene)&&!window.reviewScene.startsWith('map')){document.getElementById(document.getElementById('campaignMap').classList.contains('active')?'mapContinue':'continueAdventure').click();if(['pause','summary'].includes(window.reviewScene))document.getElementById('pauseBtn').click();if(window.reviewScene==='summary')document.getElementById('pauseFinish').click();}<\/script>`;
 html=html.replace('<head>','<head><base href="../">').replace('<script src="app.js',override+'<script src="app.js').replace('</body>',activate+'</body>');
 document.open();document.write(html);document.close();
});</script></html>
