<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlitzWord · Mage motion review</title>
<style>body{margin:0;background:#102c23;color:#fff4d6;font:16px system-ui}header{padding:18px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}h1{font:600 22px Georgia;margin:0 auto 0 0}button,select{font:inherit;border:1px solid #bdad79;background:#fff3d6;color:#143b2c;border-radius:20px;padding:10px 15px;cursor:pointer}p{margin:0;padding:0 24px 14px;opacity:.8}iframe{display:block;width:min(1180px,100%);height:min(76vh,790px);border:0;margin:auto;border-radius:16px}footer{padding:14px 24px;font-size:14px}</style>
<header><h1>Male mage · three opponents</h1><select id="enemy" aria-label="Opponent"><option value="thornling">Thornling D</option><option value="golem">Moss Golem B</option><option value="beetle">Three Bark Beetles C</option></select><select id="action" aria-label="Action"><option value="cast">Cast + enemy recoil</option><option value="counter">Enemy attack + mage recoil</option><option value="assist">Pip fire assist</option><option value="defeat">Defeat an enemy</option><option value="loss">Mage defeat</option><option value="victory">Mage celebration</option><option value="enemyvictory">Enemy celebration</option></select><button id="play">Play</button><button id="portrait">Portrait</button></header>
<p>The actual game, using a temporary save held only in memory. Reading stays still. Health changes once, at impact.</p>
<iframe id="game" title="BlitzWord isolated battle preview"></iframe><footer>The same frames and timing run in the game. <a href="all-motion-review.html" style="color:inherit">Review all enemies and groups</a>.</footer>
<script>const game=document.querySelector('#game'),enemy=document.querySelector('#enemy'),action=document.querySelector('#action');function play(){game.src='review-app.html?scene=motion-mage-'+enemy.value+'-'+action.value+'&motion=play&v='+Date.now();}document.querySelector('#play').onclick=play;enemy.onchange=play;action.onchange=play;document.querySelector('#portrait').onclick=()=>{const portrait=game.style.width!=='430px';game.style.width=portrait?'430px':'';game.style.height=portrait?'780px':'';};play();</script></html>
