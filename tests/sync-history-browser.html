<!doctype html><html><head><meta charset="utf-8"><title>Sync history verification</title><style>body{font:20px system-ui;max-width:800px;margin:40px;background:#f7f4e9;color:#17382c}button{font:inherit;padding:16px}pre{white-space:pre-wrap}</style></head><body><h1>Sync history verification</h1><p>Synthetic data only. Uses a separate test database.</p><button id="run">Run offline history checks</button><pre id="result">Ready</pre><script src="../assets/ui/sync-history.js"></script><script>
document.querySelector('#run').onclick=async()=>{const output=document.querySelector('#result');try{const name='blitz-sync-qa-'+Date.now(),id='synthetic',state={campaign:{battleRecords:[{id:'answer-test',at:'2026-10-11T01:00:00Z',target:'cat',correct:true}]}};let queue=BlitzSyncHistory.create(indexedDB,name);await queue.capture(id,state,'qa');await queue.capture(id,state,'qa');let rows=await queue.pending(id);if(rows.length!==1)throw Error('Duplicate capture');queue=BlitzSyncHistory.create(indexedDB,name);rows=await queue.pending(id);if(rows.length!==1)throw Error('Persistence');await queue.acknowledge(rows.map(r=>r.key));await queue.capture(id,state,'qa');if((await queue.pending(id)).length)throw Error('Repeated upload');await queue.clear(id);output.textContent='PASS: browser storage persists queued answers.\nPASS: duplicate capture produces one event.\nPASS: acknowledged events do not upload twice.\nPASS: deletion clears the test history.\nNo learner save was read or changed.';}catch(e){output.textContent='FAIL: '+e.message;}};
</script></body></html>
