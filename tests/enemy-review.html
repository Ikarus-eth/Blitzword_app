<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlitzWord · Enemy animation studio</title>
<link rel="stylesheet" href="../enemy-art.css?v=layered-enemies-20260923-r1">
<style>
*{box-sizing:border-box}body{margin:0;background:#162d25;color:#f5ead2;font:16px system-ui}header{padding:22px 30px;background:#10231d;position:sticky;top:0;z-index:5;border-bottom:1px solid #59725a}h1{font:28px Georgia;margin:0 0 10px}p{margin:8px 0;color:#b9c7b4;font-size:14px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}button,select{background:#eeddb7;color:#263d2e;border:1px solid #bda56e;border-radius:9px;padding:9px 13px;font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #f8bd6a}label{display:flex;gap:8px;align-items:center}main{max-width:1300px;margin:auto;padding:22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}article{border-radius:16px;background:radial-gradient(ellipse at 50% 70%,#536b4e,#243e32 65%);border:1px solid #66805b;overflow:hidden;text-align:center}article h2{font:18px Georgia;margin:0;padding:0 6px 7px}.stage{height:260px;position:relative;padding:12px}.stage.single{height:440px}.stage.single .puppet{width:100%;height:100%}.puppet{position:relative;width:100%;height:100%}.stage.group .puppet{position:absolute;width:48%;height:66%;bottom:8%;left:26%}.stage.group .puppet:nth-child(2){left:1%;bottom:24%;scale:.83}.stage.group .puppet:nth-child(3){left:49%;bottom:21%;scale:.88}.stage.group .puppet:nth-child(4){left:7%;bottom:-2%;scale:.86}.stage.group .puppet:nth-child(5){left:46%;bottom:-3%;scale:.9}a{color:#c1d1bd;font-size:12px;display:inline-block;margin:0 0 12px}.hold .bone,.hold .face{animation-play-state:paused!important;animation-delay:-.72s!important}.focus{grid-template-columns:minmax(0,620px);justify-content:center}.selection{color:#9fb79c;font-size:12px;letter-spacing:.04em}#status{margin-left:auto;color:#c2d1bd;font-size:13px}@media(max-width:850px){main{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{height:250px}}@media(max-width:480px){header{padding:16px}.controls{gap:6px}button,select{font-size:14px;padding:8px}.stage{height:185px}main{padding:12px;gap:9px}article h2{font-size:16px}}@media(prefers-reduced-motion:reduce){.bone{animation:none!important}}
</style>
<header><h1>BlitzWord · Enemy animation studio</h1><p>Twenty selected creatures. Use the controls to inspect their painted parts in motion. This page does not access learner saves.</p><div class="controls"><label>Creature <select id="creature"><option value="all">All 20 enemies</option></select></label><label>Group <select id="count"><option value="1">One</option><option value="3">Three</option><option value="5">Five</option></select></label><button data-state="">Neutral</button><button data-state="enemyAttack">Attack</button><button data-state="enemyHit">Hit</button><button data-state="enemyDefeated">Defeated</button><button data-state="escaping">Celebrate</button><label><input type="checkbox" id="hold">Hold pose</label><span id="status">Still</span></div></header><main id="grid"></main>
<script src="../enemy-art-data.js?v=layered-enemies-20260923-r1"></script><script src="../enemy-art.js?v=layered-enemies-20260923-r1"></script><script>
const choose=document.getElementById('creature'),count=document.getElementById('count'),hold=document.getElementById('hold'),grid=document.getElementById('grid');let activeState='';
const ids=BlitzEnemyArt.ids.sort((a,b)=>BlitzEnemyArt.data[a].selection.localeCompare(BlitzEnemyArt.data[b].selection));
for(const id of ids){const o=document.createElement('option');o.value=id;o.textContent=BlitzEnemyArt.data[id].name;choose.append(o)}
function paint(){const selected=choose.value==='all'?ids:[choose.value];grid.className=choose.value==='all'?'':'focus';grid.replaceChildren();for(const id of selected){const art=BlitzEnemyArt.data[id],card=document.createElement('article');card.innerHTML='<div class="stage '+(choose.value==='all'?'':'single ')+(count.value==='1'?'':'group')+'">'+Array.from({length:Number(count.value)},()=>'<div class="puppet '+activeState+(hold.checked?' hold':'')+'">'+BlitzEnemyArt.render(id,{prefix:'../'})+'</div>').join('')+'</div><div class="selection">'+art.selection+'</div><h2>'+art.name+'</h2><a href="../'+art.source+'">Parts atlas</a>';grid.append(card)}document.getElementById('status').textContent=activeState?({'enemyAttack':'Attack','enemyHit':'Hit','enemyDefeated':'Defeated','escaping':'Celebrate'}[activeState])+(hold.checked?' · held':' · 1.2 seconds'):'Still'}
choose.onchange=paint;count.onchange=paint;hold.onchange=paint;document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{activeState=b.dataset.state;paint()});paint();
</script></html>
