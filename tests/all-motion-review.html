<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlitzWord · All enemy animations</title>
<style>body{margin:0;background:#102c23;color:#fff4d6;font:16px system-ui}header{padding:16px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font:600 22px Georgia;margin:0 auto 0 0}button,select{font:inherit;border:1px solid #bdad79;background:#fff3d6;color:#143b2c;border-radius:16px;padding:10px;max-width:100%;cursor:pointer}p{padding:0 22px;margin:0 0 14px}iframe{display:block;width:min(1180px,100%);height:790px;border:0;margin:auto;border-radius:16px}footer{padding:16px}</style>
<header><h1>Mage and Pip · All enemies</h1><select id="enemy" aria-label="Enemy and group"></select><select id="action" aria-label="Action"><option value="cast">Staff cast + enemy recoil</option><option value="counter">Enemy attack</option><option value="assist">Staff + Pip’s fire</option><option value="defeat">Defeat one member</option><option value="loss">Mage defeat</option><option value="victory">Mage victory</option><option value="enemyvictory">Enemy victory</option></select><button id="play">Play</button><button id="portrait">Portrait</button></header>
<p>All 60 encounters, including groups of two, three and five. This review uses a temporary save and never changes your adventure.</p><iframe id="game" title="BlitzWord animation review"></iframe><footer><a style="color:inherit" href="../">Play BlitzWord</a></footer>
<script src="../content.js"></script><script>
const game=document.querySelector('#game'),enemy=document.querySelector('#enemy'),action=document.querySelector('#action');
for(const e of BlitzContent.enemyVariants){const o=document.createElement('option');o.value=e.id;o.textContent=e.name+' · '+e.minHealth+'–'+e.maxHealth+' hearts';enemy.append(o);}
const q=new URLSearchParams(location.search);if([...enemy.options].some(o=>o.value===q.get('enemy')))enemy.value=q.get('enemy');
function play(){game.src='review-app.html?scene='+encodeURIComponent('motion-all:'+enemy.value+':'+action.value)+'&motion=play&v='+Date.now();}
document.querySelector('#play').onclick=play;enemy.onchange=play;action.onchange=play;document.querySelector('#portrait').onclick=()=>{const p=game.style.width!=='430px';game.style.width=p?'430px':'';game.style.height=p?'900px':'790px';};play();
</script></html>
